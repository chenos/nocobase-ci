name: Check out a forwarded platform head
description: Obtain a fixed-source OIDC token and revoke it before executing any application code.
inputs:
  job:
    description: One of the five platform quality check names.
    required: true
  request-id:
    description: The Bot request UUID.
    required: true
  event-name:
    description: The original pull_request or push event.
    required: true
  head-sha:
    description: Immutable source head SHA.
    required: true
  base-sha:
    description: Immutable source base SHA.
    required: true
  target-branch:
    description: The source target branch, main.
    required: true
  pr-number:
    description: The source PR number, or zero for a push.
    required: true
  skip-label:
    description: Whether the PR has no-preview; quality checks still run.
    required: true
runs:
  using: composite
  steps:
    - name: Validate platform dispatch
      shell: bash
      env:
        REPOSITORY: multi-tenant-platform-app
        CHECKOUT_PATH: platform
        REQUEST_ID: ${{ inputs.request-id }}
        EVENT_NAME: ${{ inputs.event-name }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SKIP_LABEL: ${{ inputs.skip-label }}
        SUBMODULES: 'false'
      run: node "$GITHUB_ACTION_PATH/../validate-inputs.mjs"
    - name: Get a platform source token
      id: source-token
      shell: bash
      env:
        REQUEST_ID: ${{ inputs.request-id }}
        JOB: ${{ inputs.job }}
      run: |
        SOURCE_TOKEN_KIND=platform bash "$GITHUB_ACTION_PATH/../source-token.sh"
    - name: Check out the immutable platform head
      uses: actions/checkout@v4
      with:
        repository: nocobase/multi-tenant-platform-app
        ref: ${{ inputs.head-sha }}
        token: ${{ steps.source-token.outputs.token }}
        persist-credentials: false
        fetch-depth: 0
        submodules: false
        path: platform
        show-progress: false
    - name: Verify the platform snapshot
      shell: bash
      working-directory: platform
      env:
        EVENT_NAME: ${{ inputs.event-name }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
        MERGE_PULL_REQUEST: 'false'
        SUBMODULES: 'false'
      run: node "$GITHUB_ACTION_PATH/../prepare-snapshot.mjs"
    - name: Check out the pinned framework
      shell: bash
      working-directory: platform
      env:
        HEAD_SHA: ${{ inputs.head-sha }}
        PLATFORM_PRO_SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
      run: node "$GITHUB_ACTION_PATH/../platform-framework.mjs"
    - name: Revoke the source token
      if: ${{ always() && steps.source-token.outputs.token != '' }}
      shell: bash
      env:
        SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
      run: |
        curl --fail-with-body --silent --show-error --request DELETE \
          --header "Authorization: Bearer $SOURCE_TOKEN" \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          https://api.github.com/installation/token
