name: Check out a forwarded nocobase/studio snapshot
description: >-
  Validate a forwarded Studio dispatch, get a read-only nocobase/studio token from nocobase-bot with the job's OIDC
  token, check out the immutable commits with the vendor/nocobase3 submodule, optionally merge the pull request, and
  revoke the token before any code of the forwarded commit runs.

inputs:
  path:
    description: The directory nocobase/studio is checked out into.
    default: studio
  job:
    description: The job's check name; nocobase-bot hands each job of a run attempt one token.
    required: true
  bot-url:
    description: The nocobase-bot origin that hands out the token.
    default: https://bot.v2.test.nocobase.com
  request-id:
    description: UUID identifying the originating source event.
    required: true
  event-name:
    description: Source event type.
    required: true
  head-sha:
    description: Immutable source head commit.
    required: true
  base-sha:
    description: Immutable source base commit or the zero SHA.
    required: true
  target-branch:
    description: Source target branch.
    required: true
  pr-number:
    description: Source pull request number or 0 for a push.
    required: true
  skip-label:
    description: Whether the source pull request has the release:skip label.
    required: true
  merge-pull-request:
    description: Create and check out a local merge commit from base_sha and head_sha.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Validate dispatch inputs
      shell: bash
      env:
        REPOSITORY: studio
        CHECKOUT_PATH: ${{ inputs.path }}
        REQUEST_ID: ${{ inputs.request-id }}
        EVENT_NAME: ${{ inputs.event-name }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SKIP_LABEL: ${{ inputs.skip-label }}
      run: node "$GITHUB_ACTION_PATH/../validate-inputs.mjs"

    # The pool repositories keep no secret: the job proves to nocobase-bot with its OIDC token (the job needs
    # `id-token: write`) that it is a run of studio-quality.yml the bot dispatched, and gets an installation token that
    # can only read nocobase/studio, once per job and run attempt (docs/ci-forwarding.md in nocobase-bot).
    - name: Get a read-only source token
      id: source-token
      shell: bash
      env:
        BOT_URL: ${{ inputs.bot-url }}
        REQUEST_ID: ${{ inputs.request-id }}
        JOB: ${{ inputs.job }}
      run: |
        set -euo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::The job has no OIDC token; it needs the id-token: write permission."
          exit 1
        fi
        oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nocobase-bot" | jq -r .value)
        echo "::add-mask::$oidc"
        body=$(jq -n --arg request_id "$REQUEST_ID" --arg job "$JOB" '{request_id: $request_id, job: $job}')
        answer=$(curl -sS --retry 3 --retry-all-errors -w '\n%{http_code}' -X POST -H "Authorization: Bearer $oidc" -H 'content-type: application/json' --data "$body" "$BOT_URL/api/ci/studio-source-token")
        status=${answer##*$'\n'}
        answer=${answer%$'\n'*}
        if [ "$status" != 200 ]; then
          echo "::error::nocobase-bot gave no Studio source token (HTTP $status): $(jq -r '.error // empty' <<<"$answer" 2>/dev/null || true)"
          exit 1
        fi
        token=$(jq -r .token <<<"$answer")
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"

    - name: Check out the immutable source head
      uses: actions/checkout@v4
      with:
        repository: nocobase/studio
        ref: ${{ inputs.head-sha }}
        token: ${{ steps.source-token.outputs.token }}
        persist-credentials: false
        fetch-depth: 0
        submodules: recursive
        path: ${{ inputs.path }}
        show-progress: false

    - name: Prepare the immutable source snapshot
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        EVENT_NAME: ${{ inputs.event-name }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
        MERGE_PULL_REQUEST: ${{ inputs.merge-pull-request }}
      run: node "$GITHUB_ACTION_PATH/../prepare-snapshot.mjs"

    - name: Revoke the source token
      if: ${{ always() && steps.source-token.outputs.token != '' }}
      shell: bash
      env:
        SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
      run: |
        curl --fail-with-body --silent --show-error --location \
          --request DELETE \
          --header 'Accept: application/vnd.github+json' \
          --header "Authorization: Bearer $SOURCE_TOKEN" \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          https://api.github.com/installation/token
