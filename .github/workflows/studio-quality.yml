name: NocoBase Studio quality
# `studio-quality:PR-<n>:<request_id>`, or `studio-quality:<branch>:<request_id>` for a push. nocobase-bot finds the run by
# this exact title (its row's `runLabel`), so change both together.
run-name: studio-quality:${{ inputs.event_name == 'pull_request' && format('PR-{0}', inputs.pr_number) || inputs.target_branch }}:${{ inputs.request_id }}

# The checks of the private nocobase/studio that need no secret, dispatched by nocobase-bot (docs/ci-forwarding.md there)
# to a repository of the CI repository pool, which mirrors each job below as a check run of the same name on
# nocobase/studio. The job names are that protocol: `Submodule pointer`, `Lint`, `Typecheck`, `Test`, `API document` and
# `CLI reference` for every request, and `PR description` and `Studio e2e` for pull requests. Studio's `Preview` and
# `Dist`, which need the secrets of 2013xile/nocobase-ci, stay in its studio-ci.yml.
#
# This repository keeps no secret. Each job checks Studio out with `.github/nocobase3/studio-checkout`, which proves to
# nocobase-bot with the job's OIDC token that it is a run the bot dispatched and gets a token that can only read
# nocobase/studio, once per job and run attempt, and revokes it before any of Studio's code runs. The helpers under
# `.github/nocobase3/` are checked out from this repository, never from the forwarded source.
#
# Studio is the workspace root of that repository and the framework is the submodule vendor/nocobase3. Studio's two
# long-lived branches mirror nocobase/nocobase's: `dev` tracks `v3-develop` and `main` tracks `v3-main`, and pull
# requests normally target `dev`. Every job installs the whole workspace with the pnpm of the repository's
# `packageManager`, and runs Studio's own scripts.
#
# A change that spans the framework and Studio is two pull requests with the same head branch name, such as
# `agent/PM-42` in both repositories. Every job that builds or tests a Studio pull request builds it against
# nocobase/nocobase's branch of that name while that branch exists with an open pull request or none at all
# (`.github/nocobase3/studio-framework`, which says which in the job summary), and against the committed pointer
# otherwise. `Submodule pointer` keeps such a pull request from merging until the pointer includes the framework change
# (`.github/nocobase3/studio-framework-gate`, a trusted step of this workflow; the pull request's own
# scripts/check-submodule.mjs only checks the pointer is reachable, and is never given a token). Both read the public
# nocobase/nocobase with this run's own token.
#
# This repository is public: nothing uploads Studio's source or its application build, and nothing is cached. Only the
# e2e job uploads its traces and failure screenshots, on failure, kept for three days.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: UUID shared with the source-repository check runs.
        required: true
        type: string
      event_name:
        description: Source event type (pull_request or push).
        required: true
        type: string
      head_sha:
        description: Immutable 40-character source head SHA.
        required: true
        type: string
      base_sha:
        description: Immutable 40-character base SHA, or forty zeroes for the first push.
        required: true
        type: string
      target_branch:
        description: Source target branch.
        required: true
        type: string
      pr_number:
        description: Positive pull request number, or 0 for a push.
        required: true
        type: string
      skip_label:
        description: Whether the source pull request has the release:skip label (true or false).
        required: true
        type: string
      head_ref:
        description: The source pull request's head branch, or empty for a push.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: studio-quality-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  submodule:
    name: Submodule pointer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/studio-checkout
        with:
          path: studio
          job: Submodule pointer
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted, and before any of the pull request's own code runs, so that code can neither see the token nor change
      # what this step reads: fails while nocobase/nocobase's change under the same head branch name is unmerged, or merged
      # but not contained in the committed pointer. The token only reads nocobase/nocobase's pull requests.
      - name: Check the framework half has merged
        uses: ./.github/nocobase3/studio-framework-gate
        with:
          head-ref: ${{ inputs.head_ref }}
          github-token: ${{ github.token }}

      # The pull request's own script, with no token: warns while vendor/nocobase3 points at a pull request branch; fails
      # when no public branch or tag carries it.
      - name: Check vendor/nocobase3 is reachable from a public branch or tag
        working-directory: studio
        run: node scripts/check-submodule.mjs

  # The pull request's type and bilingual changelog (Studio's PR template), checked by Studio's own
  # scripts/release/check-pr-body.mjs from the merge checkout. studio-checkout saves the title and body with the source
  # token, which nocobase-bot gives pull request read access for this job only, and revokes it before the script runs;
  # the script reads the file and is never given a token. Neither the framework submodule nor dependencies are needed.
  # The body is read when the job runs: after editing the description, re-run this job.
  pr-description:
    name: PR description
    if: ${{ inputs.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/studio-checkout
        with:
          path: studio
          job: PR description
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}
          submodules: 'false'
          pull-request-body: ${{ runner.temp }}/pull-request.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # A base from before the check existed has no script; the job then passes rather than block the pull request.
      - name: Check the pull request description
        working-directory: studio
        run: |
          if [ -f scripts/release/check-pr-body.mjs ]; then
            node scripts/release/check-pr-body.mjs "$RUNNER_TEMP/pull-request.json"
          else
            echo "::notice::scripts/release/check-pr-body.mjs is not in this checkout; the pull request description is not checked."
          fi

  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    env:
      # Typecheck and type-aware lint load the whole framework from the submodule's sources; the default heap is too small.
      NODE_OPTIONS: --max-old-space-size=6144
    strategy:
      fail-fast: false
      matrix:
        include:
          # ESLint with its type-aware rules, then Prettier over the repository (Studio's `check` runs both).
          - name: Lint
            run: pnpm lint && pnpm format:check
          # The client, the Node tooling and the server tsconfigs.
          - name: Typecheck
            run: pnpm typecheck
          # Vitest over tests/**; no build and no browser.
          - name: Test
            run: pnpm test
          # Starts Studio on SQLite test databases with the framework's check; no build needed.
          - name: API document
            run: pnpm openapi:check
          # The command reference (docs/cli/reference) is generated from the API document.
          - name: CLI reference
            run: pnpm cli-reference:check
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/studio-checkout
        with:
          path: studio
          job: ${{ matrix.name }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: studio/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Choose the framework
        id: framework
        uses: ./.github/nocobase3/studio-framework
        with:
          head-ref: ${{ inputs.head_ref }}
          github-token: ${{ github.token }}

      - name: Install dependencies
        working-directory: studio
        env:
          INSTALL_FLAG: ${{ steps.framework.outputs.install-flag }}
        run: pnpm install "$INSTALL_FLAG"

      - name: ${{ matrix.name }}
        working-directory: studio
        run: ${{ matrix.run }}

  # Studio's browser tests (docs/e2e.md in nocobase/studio) against a throwaway Studio the tests start from the build
  # (dist/server/standalone.js), on SQLite with the demo data and a local mock model. No secrets: the server and the
  # model are local, and nothing reaches GitHub or a model provider.
  e2e:
    name: Studio e2e
    if: ${{ inputs.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    env:
      # The build typechecks Studio and the framework together, which needs more than Node's default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/studio-checkout
        with:
          path: studio
          job: Studio e2e
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: studio/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Choose the framework
        id: framework
        uses: ./.github/nocobase3/studio-framework
        with:
          head-ref: ${{ inputs.head_ref }}
          github-token: ${{ github.token }}

      - name: Install dependencies
        working-directory: studio
        env:
          INSTALL_FLAG: ${{ steps.framework.outputs.install-flag }}
        run: pnpm install "$INSTALL_FLAG"

      # Builds the workspace packages Studio depends on, then Studio's client and server into dist, with the universal
      # nb-studio and nocobase-runner packages in dist/runners.
      - name: Build Studio
        working-directory: studio
        run: pnpm build

      - name: Install Chromium
        working-directory: studio
        run: pnpm exec playwright install --with-deps chromium

      # The `e2e` Playwright project: every flow in e2e/*.test.ts, the phone flows at iPhone 13 size.
      - name: Flows
        working-directory: studio
        run: pnpm test:e2e

      # The flows' traces and failure screenshots. The `screenshots` Playwright project (`pnpm test:screenshots`)
      # asserts nothing beyond page errors and is not run on pull requests; run it locally when a change needs it.
      - name: Upload failed test traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-e2e-results
          path: studio/test-results
          if-no-files-found: ignore
          retention-days: 3
