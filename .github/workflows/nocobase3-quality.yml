name: NocoBase 3 quality
# `nocobase3-quality:PR-<n>:<request_id>`, or `nocobase3-quality:<branch>:<request_id>` for a push. nocobase-bot finds
# the run by this exact title (its row's `runLabel`), so change both together.
run-name: nocobase3-quality:${{ inputs.event_name == 'pull_request' && format('PR-{0}', inputs.pr_number) || inputs.target_branch }}:${{ inputs.request_id }}

# The Quality checks of NocoBase 3 in nocobase/nocobase, dispatched by nocobase-bot (docs/ci-forwarding.md there) for
# pull requests from branches of that repository whose direct target is v3-develop, v3-main or a single-level
# <type>/v3-<name> stacked branch, and for pushes to v3-develop or v3-main whose head commit does not say `[skip ci]`.
# Fork pull requests are not forwarded. This file is the only definition of these checks: nocobase/nocobase keeps no copy.
#
# The bot mirrors these job names as check runs on nocobase/nocobase, so they are a protocol: `Changed files`,
# `Typecheck`, `Test`, `Build`, `Create-app smoke (default)`, `Create-app smoke (examples)`, `App-installer smoke` and
# `quality`. The database matrix is not mirrored job by job; `quality` fails when any selected database fails.
#
# `Pro DB integration` is mirrored too, but `quality` does not wait for it, so it never blocks a merge: it tests the
# database drivers kept in the private nocobase/nocobase3-pro (KingbaseES, Dameng, OceanBase) against the forwarded
# commit, when the planner selects every database, that is when a change touches what all of them share. This repository
# keeps no secret for it: each `Pro DB integration (<database>)` job proves to nocobase-bot with its OIDC token that it is
# a run the bot dispatched, and gets a token that can only read nocobase3-pro, revoked as soon as Pro is cloned.
#
# A change that touches only docs/** runs nothing: every job reports skipped, as the old paths-ignore filter did.
#
# Otherwise `Select quality scope` runs the forwarded commit's scripts/select-quality-scope.mjs, which decides how much
# of Typecheck, Test, Build and the smoke tests a pull request needs:
#
# - Everything runs for a push, for a comparison without a usable base, and for a change to what every package is
#   built, linted or tested with: the root manifest, lockfile and workspace, npm and pnpm configuration, .gitignore,
#   the root ESLint and lint-staged configuration, patches/, packages/tools/dev-config/, scripts/, tests/, .github/
#   and dev/. A commit that predates the script runs everything too, so a pull request that is not rebased is safe.
# - Otherwise the selected packages are the ones the diff touches and every package depending on them (dependencies,
#   devDependencies and peerDependencies), plus the packages whose tests read a changed path without declaring it
#   (the script's `pathDependencies`). Typecheck and Test cover only those; the root db:typecheck and db:test run
#   when a selected package is one dev/db imports; scripts:test and the repository-wide checks always run.
# - Build builds and pack-checks only the selected packages, unless a template, create-app or app-installer is among
#   them: then it builds every package as before, because `Create-app smoke (default)` and `(examples)` install every
#   packed tarball. Those two run only when a template or create-app is selected, `App-installer smoke` only when
#   app-installer or the default template is, and `quality` accepts them as skipped when the plan says so.
# - A change outside every package, such as a changeset alone, builds and tests nothing but still runs the checks
#   above. Every job still reports a result, so the mirrored check runs keep their names.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: UUID shared with the source-repository check runs.
        required: true
        type: string
      event_name:
        description: Source event type (pull_request or push).
        required: true
        type: string
      head_sha:
        description: Immutable 40-character source head SHA.
        required: true
        type: string
      base_sha:
        description: Immutable 40-character base SHA, or forty zeroes for the first push.
        required: true
        type: string
      target_branch:
        description: Source target branch.
        required: true
        type: string
      pr_number:
        description: Positive pull request number, or 0 for a push.
        required: true
        type: string
      skip_label:
        description: Sent by the bot for every forwarded workflow; unused here.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nocobase3-quality-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Validate the dispatch
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          EVENT_NAME: ${{ inputs.event_name }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          fail() { echo "::error::Invalid CI dispatch: $1"; exit 1; }
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || fail 'request_id must be a UUID.'
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && ! "$HEAD_SHA" =~ ^0+$ ]] || fail 'head_sha must be a non-zero commit SHA.'
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'base_sha must be a commit SHA.'
          case "$EVENT_NAME" in
            pull_request)
              [[ "$TARGET_BRANCH" =~ ^(v3-develop|v3-main|[^/]+/v3-[^/]+)$ ]] || fail 'target_branch must be a v3 target.'
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || fail 'pr_number must be a positive integer.'
              [[ ! "$BASE_SHA" =~ ^0+$ ]] || fail 'a pull request cannot use a zero base_sha.'
              ;;
            push)
              [[ "$TARGET_BRANCH" =~ ^(v3-develop|v3-main)$ ]] || fail 'pushes are forwarded for v3-develop and v3-main only.'
              [ "$PR_NUMBER" = '0' ] || fail 'pr_number must be 0 for a push.'
              ;;
            *) fail 'event_name must be pull_request or push.' ;;
          esac

      # Read through the compare API rather than a clone: the answer only decides whether anything else runs. A
      # comparison GitHub truncates (more than 300 files) or cannot make runs everything.
      - name: Skip documentation-only changes
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(gh api "repos/nocobase/nocobase/compare/$BASE_SHA...$HEAD_SHA" --jq '.files | if length >= 300 then "__truncated__" else .[].filename end'); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '^docs/'; then
            echo "Only docs/** changed; Quality is skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # The plan is read from the checked-out commit's own script, so the rules travel with the code they describe.
  quality-plan:
    name: Select quality scope
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.select.outputs.full }}
      packages: ${{ steps.select.outputs.packages }}
      package_count: ${{ steps.select.outputs.package_count }}
      filter: ${{ steps.select.outputs.filter }}
      run_db_checks: ${{ steps.select.outputs.run_db_checks }}
      run_build: ${{ steps.select.outputs.run_build }}
      build_full: ${{ steps.select.outputs.build_full }}
      pack_packages: ${{ steps.select.outputs.pack_packages }}
      run_create_app: ${{ steps.select.outputs.run_create_app }}
      run_app_installer: ${{ steps.select.outputs.run_app_installer }}
    steps:
      - name: Check out the forwarded commit
        uses: chenos/nocobase-ci/.github/actions/nocobase3-checkout@main
        with:
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Select affected packages
        id: select
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          EVENT_NAME: ${{ inputs.event_name }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/select-quality-scope.mjs ]; then
            echo "This commit has no scripts/select-quality-scope.mjs; running everything." | tee -a "$GITHUB_STEP_SUMMARY"
            printf '%s\n' full=true 'packages=[]' package_count=0 filter= run_db_checks=true run_build=true \
              build_full=true 'pack_packages=[]' run_create_app=true run_app_installer=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_SHA="$(git rev-parse HEAD)" node scripts/select-quality-scope.mjs

  changed-files:
    name: Changed files
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the forwarded commit
        uses: chenos/nocobase-ci/.github/actions/nocobase3-checkout@main
        with:
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared development config
        run: pnpm dev-config:build

      # ESLint is run per package rather than over one list of every changed file. The type-aware rules build a
      # TypeScript program per file and hold it for the length of the run, so a single process grows with the size of
      # the change: a repository-wide refactor touching a couple of thousand files exhausts the runner's heap and the
      # job dies with an allocation failure instead of a lint result. One process per package bounds that, because
      # each exits and frees what it held.
      #
      # `...[$BASE_SHA]` selects the packages the diff touched and the packages depending on them, whose type-aware
      # rules read the changed package's types. The workspace root is excluded from it: it owns every file outside a
      # package, such as a changeset, so almost every change selects it, and its own `lint` script is a recursive lint
      # of every package. The root's own files are covered instead by the root ESLint run below and by `db:lint`
      # (dev/db, two seconds). A change to what every package lints with — the root manifest, lockfile, workspace
      # catalog, npm or pnpm configuration, patches or the root ESLint configuration — runs the root `lint`, which is
      # every package. A change to `@nocobase/dev-config` reaches every package through `...` already.
      #
      # Prettier keeps taking every changed file at once. It parses and prints one file at a time without any
      # cross-file analysis, so its memory does not scale the same way — the same diff that kills ESLint peaks well
      # under half a gigabyte here.
      - name: Check changed files
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi

          # Files outside any package: the root ESLint configuration covers `scripts/`, `tests/`, and the root
          # `.js`/`.mjs`/`.cjs` files, but no package owns them, so the per-package run below never reaches them.
          root_files=()
          prettier_files=()
          lint_everything=false

          # Every change kind, deletions and both sides of renames included, decides whether everything is linted.
          while IFS= read -r -d '' file; do
            case "$file" in
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc|.pnpmfile.cjs|pnpmfile.cjs|patches/*|eslint.config.js)
                lint_everything=true
                ;;
            esac
          done < <(git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA")

          while IFS= read -r -d '' file; do
            case "$file" in
              packages/*) ;;
              *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx|*.mts|*.cts) root_files+=("$file") ;;
            esac

            case "$file" in
              *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx|*.mts|*.cts|*.json|*.json5|*.jsonc|*.md|*.mdx|*.yml|*.yaml|*.css|*.scss|*.less|*.html)
                prettier_files+=("$file")
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA")

          if ((${#root_files[@]})); then
            pnpm exec eslint --no-warn-ignored --max-warnings 0 -- "${root_files[@]}"
          fi

          if [ "$lint_everything" = true ]; then
            echo "Workspace tooling changed; linting every package."
            pnpm lint
          else
            root_package="$(node -p "require('./package.json').name")"
            pnpm --filter "...[$BASE_SHA]" --filter "!$root_package" --if-present lint
            pnpm db:lint
          fi

          if ((${#prettier_files[@]})); then
            pnpm exec prettier --check --ignore-path .prettierignore -- "${prettier_files[@]}"
          fi

  typecheck:
    name: Typecheck
    needs:
      - scope
      - quality-plan
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the forwarded commit
        uses: chenos/nocobase-ci/.github/actions/nocobase3-checkout@main
        with:
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs before the typecheck because a misdeclared dependency is decided by reading manifests, and reporting it in
      # seconds is more useful than reporting it after a full typecheck.
      - name: Check peer dependencies
        run: pnpm peers:check

      # Same reasoning: a dependency declared in the wrong place is decided by reading manifests and sources, and it
      # otherwise surfaces only once a published package is installed somewhere its devDependencies are absent.
      - name: Check runtime dependencies
        run: pnpm deps:check

      # A test that configures SQLite or asserts on SQLite-only SQL passes on every default run and fails only on another
      # database, so it is caught by reading the source rather than by running it.
      - name: Check database test portability
        run: pnpm db-tests:check

      # The UI Library catalog the application Skill ships (references/frontend/references/ui-library.md) is generated
      # from ui-library/registry; an item added or redescribed without regenerating it fails here.
      - name: Check the UI Library catalog is up to date
        run: pnpm ui-library-catalog:check

      # Starts each template on SQLite test databases and fails on an /api route that declares nothing, a documented
      # operation without tags, summary or operationId, a duplicate operationId, or a schema reference the document
      # cannot resolve. It needs no build: the templates run from their TypeScript sources.
      - name: Check API document declarations
        run: pnpm openapi:check

      - name: Typecheck
        if: ${{ needs.quality-plan.outputs.full == 'true' }}
        run: pnpm typecheck

      # The root `typecheck` script, narrowed to the selected packages; `db:typecheck` covers dev/db. The script is
      # compared first, so a change to it fails here instead of silently leaving a part of the check unrun.
      - name: Check the typecheck script this narrowing replaces
        if: ${{ needs.quality-plan.outputs.full != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(node -p "require('./package.json').scripts.typecheck")"
          if [ "$actual" != 'pnpm -r --if-present typecheck && pnpm db:typecheck' ]; then
            echo "::error::The typecheck script of package.json is now '$actual'; update the Typecheck job of nocobase3-quality.yml in chenos/nocobase-ci to match it."
            exit 1
          fi

      - name: Typecheck the selected packages
        if: ${{ needs.quality-plan.outputs.full != 'true' && needs.quality-plan.outputs.package_count != '0' }}
        env:
          FILTER: ${{ needs.quality-plan.outputs.filter }}
        run: |
          # shellcheck disable=SC2086 # FILTER holds --filter=<package name> arguments, which contain no spaces.
          pnpm -r --if-present $FILTER typecheck

      - name: Typecheck dev/db
        if: ${{ needs.quality-plan.outputs.full != 'true' && needs.quality-plan.outputs.run_db_checks == 'true' }}
        run: pnpm db:typecheck

  # The root `test` script, split across runners so that each takes about seven minutes. One runner took about 25
  # minutes: `pnpm -r` waits for every dependency's tests before a package's own, so the packages that depend on most
  # of the workspace started last, and four vitest processes shared four cores.
  #
  # - The heaviest packages are assigned to a shard by name in `ASSIGNED_PACKAGES`, grouped by measured duration.
  #   A name there that no longer matches a package fails the run rather than silently testing nothing.
  # - `others` takes every remaining package by exclusion, so a new package lands there on its own, and the root's
  #   `scripts:test` and `db:test`.
  #
  # Packages run with `--no-sort`, because tests do not need dependency order.
  #
  # The two application templates are left out. Their `tests/` ship in the template package, so `Create-app smoke
  # (default)` and `(examples)` run the very same suites with `pnpm test` in an application generated from the packed
  # tarballs; running them here as well only repeats them against the workspace sources.
  #
  # The scripts are spelled out rather than called, so the ones they replace are compared first: a change to the root
  # test script fails here instead of silently leaving a part of the suite unrun.
  #
  # When the plan is not a full run, each shard tests only the selected packages it would otherwise test, and a shard
  # left with none skips its steps and succeeds. `others` always runs `scripts:test`, whose tests read files of many
  # packages, and runs `db:test` only when the plan selects the dev/db checks.
  test-shard:
    name: Test (${{ matrix.shard }})
    needs:
      - scope
      - quality-plan
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [agents, 'projects, mail, cli', others]
    env:
      SHARD: ${{ matrix.shard }}
      FULL: ${{ needs.quality-plan.outputs.full }}
      PACKAGES: ${{ needs.quality-plan.outputs.packages }}
      ASSIGNED_PACKAGES: |
        {
          "agents": ["@nocobase/app-plugin-agents", "@nocobase/agent-runner"],
          "projects, mail, cli": [
            "@nocobase/app-plugin-projects",
            "@nocobase/app-plugin-mail",
            "@nocobase/create-plugin",
            "@nocobase/app-plugin-releases",
            "@nocobase/app-cli-client",
            "@nocobase/app-cli"
          ]
        }
    steps:
      - name: Check out the forwarded commit
        uses: chenos/nocobase-ci/.github/actions/nocobase3-checkout@main
        with:
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # `others` always has scripts:test to run; an assigned shard runs when one of its packages is selected.
      - name: Select the packages of this shard
        id: shard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SHARD" = others ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          names="$(node -e '
            const names = JSON.parse(process.env.ASSIGNED_PACKAGES)[process.env.SHARD];
            const selected = new Set(JSON.parse(process.env.PACKAGES));
            for (const name of names) if (process.env.FULL === "true" || selected.has(name)) console.log(name);
          ')"
          if [ -n "$names" ]; then
            echo "Testing: $(tr '\n' ' ' <<<"$names")"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No package of this shard is selected; nothing to test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: ${{ steps.shard.outputs.run == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Check the test scripts this split replaces
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local actual
            actual="$(node -p "require('./$1').scripts.test")"
            if [ "$actual" != "$2" ]; then
              echo "::error::The test script of $1 is now '$actual'; update the test shards of nocobase3-quality.yml in chenos/nocobase-ci to match it."
              exit 1
            fi
          }
          check package.json 'pnpm scripts:test && pnpm -r --if-present test && pnpm db:test'

      - name: Check the assigned packages exist
        shell: bash
        run: |
          set -euo pipefail
          known="$(pnpm ls -r --depth -1 --json | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).map(p=>p.name).join("\n")))')"
          missing=0
          while IFS= read -r name; do
            if ! grep -qxF "$name" <<<"$known"; then
              echo "::error::ASSIGNED_PACKAGES names $name, which is not a workspace package; update the test shards of nocobase3-quality.yml in chenos/nocobase-ci."
              missing=1
            fi
          done < <(node -e 'for (const names of Object.values(JSON.parse(process.env.ASSIGNED_PACKAGES))) for (const name of names) console.log(name)')
          exit "$missing"

      - name: Test the assigned packages
        if: ${{ matrix.shard != 'others' && steps.shard.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          filters=()
          while IFS= read -r name; do filters+=(--filter "$name"); done < <(node -e '
            const selected = new Set(JSON.parse(process.env.PACKAGES));
            for (const name of JSON.parse(process.env.ASSIGNED_PACKAGES)[process.env.SHARD])
              if (process.env.FULL === "true" || selected.has(name)) console.log(name);
          ')
          pnpm -r --no-sort --if-present "${filters[@]}" test

      # Without a full run the selected packages are the positive filters, and the exclusions below still apply.
      - name: Test every other package
        if: ${{ matrix.shard == 'others' }}
        shell: bash
        env:
          FILTER: ${{ needs.quality-plan.outputs.filter }}
          PACKAGE_COUNT: ${{ needs.quality-plan.outputs.package_count }}
          RUN_DB_CHECKS: ${{ needs.quality-plan.outputs.run_db_checks }}
        run: |
          set -euo pipefail
          root_package="$(node -p "require('./package.json').name")"
          filters=(--filter "!$root_package" --filter '!./packages/templates/**')
          while IFS= read -r name; do filters+=(--filter "!$name"); done \
            < <(node -e 'for (const names of Object.values(JSON.parse(process.env.ASSIGNED_PACKAGES))) for (const name of names) console.log(name)')
          pnpm scripts:test
          if [ "$FULL" = true ]; then
            pnpm -r --no-sort --if-present "${filters[@]}" test
          elif [ "$PACKAGE_COUNT" != 0 ]; then
            # shellcheck disable=SC2086 # FILTER holds --filter=<package name> arguments, which contain no spaces.
            pnpm -r --no-sort --if-present $FILTER "${filters[@]}" test
          fi
          if [ "$FULL" = true ] || [ "$RUN_DB_CHECKS" = true ]; then
            pnpm db:test
          fi

  test:
    name: Test
    needs: test-shard
    if: ${{ always() && needs.test-shard.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify every test shard
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "One or more test shards concluded with $RESULT."
            exit 1
          fi

  # A full plan builds every package, as `Create-app smoke` needs every tarball. Otherwise only the selected packages
  # are built, in dependency order, and pack-checked: their builds compile against the other packages' sources, so no
  # dist of an unselected package is needed. A plan selecting no package builds nothing.
  build:
    name: Build
    needs:
      - scope
      - quality-plan
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_FULL: ${{ needs.quality-plan.outputs.build_full }}
      RUN_BUILD: ${{ needs.quality-plan.outputs.run_build }}
    steps:
      - name: Check out the forwarded commit
        uses: chenos/nocobase-ci/.github/actions/nocobase3-checkout@main
        with:
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: ${{ env.RUN_BUILD == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build
        if: ${{ env.BUILD_FULL == 'true' }}
        run: pnpm build

      # The root `build` script, narrowed to the selected packages; it is compared first, so a change to it fails here
      # instead of building differently from it.
      - name: Build the selected packages
        if: ${{ env.BUILD_FULL != 'true' && env.RUN_BUILD == 'true' }}
        shell: bash
        env:
          FILTER: ${{ needs.quality-plan.outputs.filter }}
        run: |
          set -euo pipefail
          actual="$(node -p "require('./package.json').scripts.build")"
          if [ "$actual" != 'NOCOBASE_SKIP_WORKSPACE_DEPENDENCY_BUILD=1 pnpm -r --if-present build' ]; then
            echo "::error::The build script of package.json is now '$actual'; update the Build job of nocobase3-quality.yml in chenos/nocobase-ci to match it."
            exit 1
          fi
          pnpm dev-config:build
          # shellcheck disable=SC2086 # FILTER holds --filter=<package name> arguments, which contain no spaces.
          NOCOBASE_SKIP_WORKSPACE_DEPENDENCY_BUILD=1 pnpm -r --if-present $FILTER build

      # pnpm build just produced every dist, so pack:check skips the build half of each prepack script.
      - name: Check package tarballs
        if: ${{ env.BUILD_FULL == 'true' }}
        env:
          PACK_DIR: ${{ runner.temp }}/nocobase-pack-check
          PACK_CHECK_PREBUILT: '1'
        run: pnpm pack:check

      # Every package's publish metadata is still validated; only the selected ones are packed and linted.
      - name: Check the selected package tarballs
        if: ${{ env.BUILD_FULL != 'true' && needs.quality-plan.outputs.pack_packages != '[]' }}
        env:
          PACK_DIR: ${{ runner.temp }}/nocobase-pack-check
          PACK_CHECK_PREBUILT: '1'
          PACK_CHECK_PACKAGES: ${{ needs.quality-plan.outputs.pack_packages }}
        run: pnpm pack:check

      - name: Upload checked package tarballs
        if: ${{ env.BUILD_FULL == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: create-app-packages
          path: ${{ runner.temp }}/nocobase-pack-check/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Keep mirrored names static: skipped matrix jobs retain their unexpanded expression,
  # so the bot cannot find the expected default/examples checks on documentation-only PRs.
  # Both run only when the plan selects a template or create-app, and need Build's tarballs of every package.
  create-app-smoke-default:
    name: Create-app smoke (default)
    needs:
      - build
      - quality-plan
    if: ${{ needs.quality-plan.outputs.run_create_app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the forwarded commit
        uses: chenos/nocobase-ci/.github/actions/nocobase3-checkout@main
        with:
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Download checked package tarballs
        uses: actions/download-artifact@v4
        with:
          name: create-app-packages
          path: ${{ runner.temp }}/nocobase-pack-check

      # Each runner installs the exact tarballs checked by Build into its own registry. Workspace package names have
      # no upstream fallback, so an already-published version cannot hide a broken artifact from this checkout. The
      # action is the checked-out source's own, at the workspace root.
      - name: Verify create-app against the checked packages
        uses: ./.github/actions/verify-create-app
        with:
          local-packages-only: 'true'
          template-kind: default
          package-artifacts: ${{ runner.temp }}/nocobase-pack-check

  create-app-smoke-examples:
    name: Create-app smoke (examples)
    needs:
      - build
      - quality-plan
    if: ${{ needs.quality-plan.outputs.run_create_app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the forwarded commit
        uses: chenos/nocobase-ci/.github/actions/nocobase3-checkout@main
        with:
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Download checked package tarballs
        uses: actions/download-artifact@v4
        with:
          name: create-app-packages
          path: ${{ runner.temp }}/nocobase-pack-check

      # Each runner installs the exact tarballs checked by Build into its own registry. Workspace package names have
      # no upstream fallback, so an already-published version cannot hide a broken artifact from this checkout. The
      # action is the checked-out source's own, at the workspace root.
      - name: Verify create-app against the checked packages
        uses: ./.github/actions/verify-create-app
        with:
          local-packages-only: 'true'
          template-kind: examples
          package-artifacts: ${{ runner.temp }}/nocobase-pack-check

  # Builds the default application's deployment archive and exercises the compiled installer's install, upgrade and
  # rollback paths on Debian. It builds what it needs itself, so it runs beside Build rather than after it.
  app-installer-smoke:
    name: App-installer smoke
    needs:
      - scope
      - quality-plan
    if: ${{ needs.scope.outputs.run == 'true' && needs.quality-plan.outputs.run_app_installer == 'true' }}
    runs-on: ubuntu-24.04
    container: node:24-bookworm
    timeout-minutes: 45
    env:
      APP_ROOT: /tmp/crm
      NOCOBASE_APP_INSTALLER_USE_DIST: '1'
    steps:
      - name: Check out the forwarded commit
        uses: chenos/nocobase-ci/.github/actions/nocobase3-checkout@main
        with:
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install pm2
        run: npm install -g pm2

      # The archive is built from this checkout rather than from a published template, so it carries the build
      # metadata and APP_STORAGE_DIR support the installer relies on, whether or not they are released yet.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app-installer
        run: |
          pnpm --filter @nocobase/app-installer build
          test -f packages/tools/app-installer/dist/cli.js

      # `pnpm build` builds the workspace packages the template depends on first, and vendors them into the archive.
      - name: Build a deployment archive of the default template
        run: |
          pnpm --filter @nocobase/app-template-default build --tar
          test -f packages/templates/app-template-default/storage/exports/dist.tar.gz

      - name: Install, upgrade and roll back the archive
        run: node scripts/smoke-app-installer.mjs --archive packages/templates/app-template-default/storage/exports/dist.tar.gz --root "$APP_ROOT" --port 13000 -- node packages/tools/app-installer/bin/run.js

      - name: Show logs
        if: failure()
        run: |
          tail -n 200 "$APP_ROOT"/logs/*.log || true
          pm2 logs --nostream --lines 100 || true

  db-integration-plan:
    name: Select DB integration tests
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      databases: ${{ steps.select.outputs.databases }}
      should_run: ${{ steps.select.outputs.should_run }}
      pro_should_run: ${{ steps.pro.outputs.should_run }}
      pro_branch: ${{ steps.pro.outputs.branch }}
    steps:
      - name: Check out the forwarded commit
        uses: chenos/nocobase-ci/.github/actions/nocobase3-checkout@main
        with:
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Select affected databases
        id: select
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: HEAD_SHA="$(git rev-parse HEAD)" node scripts/select-db-integration-matrix.mjs

      # The Pro drivers are built on what the planner treats as shared by every database (packages/libs/db, db-testkit,
      # the root manifests and so on), so they run exactly when it selects all of them. Pro's develop follows v3-develop
      # and its main v3-main; a pull request stacked on another branch takes the line its base has the fewest commits
      # beyond, develop on a tie.
      - name: Select the Pro database drivers
        id: pro
        env:
          DATABASES: ${{ steps.select.outputs.databases }}
          EVENT_NAME: ${{ inputs.event_name }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          every=$(node --input-type=module -e "import { databases } from './scripts/select-db-integration-matrix.mjs'; console.log(JSON.stringify(databases))")
          should_run=$(node -e 'const [a, b] = process.argv.slice(1).map(JSON.parse); console.log(a.length === b.length && b.every((each) => a.includes(each)))' "$DATABASES" "$every")
          case "$TARGET_BRANCH" in
            v3-main) branch=main ;;
            v3-develop) branch=develop ;;
            *)
              beyond_develop=$(git rev-list --count "origin/v3-develop..$BASE_SHA")
              beyond_main=$(git rev-list --count "origin/v3-main..$BASE_SHA")
              if [ "$beyond_main" -lt "$beyond_develop" ]; then branch=main; else branch=develop; fi
              echo "Stacked on $TARGET_BRANCH: $beyond_develop commits beyond v3-develop, $beyond_main beyond v3-main."
              ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Pro DB integration: $should_run (Pro $branch)" | tee -a "$GITHUB_STEP_SUMMARY"

  db-integration:
    name: DB integration (${{ matrix.database }})
    needs: db-integration-plan
    if: ${{ needs.db-integration-plan.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJSON(needs.db-integration-plan.outputs.databases) }}
    steps:
      - name: Check out the forwarded commit
        uses: chenos/nocobase-ci/.github/actions/nocobase3-checkout@main
        with:
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared development config
        run: pnpm dev-config:build

      - name: Test ${{ matrix.database }}
        run: pnpm --filter @nocobase/db-${{ matrix.database }} test:integration

  pro-db-integration:
    name: Pro DB integration (${{ matrix.database }})
    needs: db-integration-plan
    if: ${{ needs.db-integration-plan.outputs.pro_should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        database: [kingbase, dameng, oceanbase]
    env:
      PRO_DIR: ${{ github.workspace }}/../nocobase3-pro
    steps:
      - name: Check out the forwarded commit
        uses: chenos/nocobase-ci/.github/actions/nocobase3-checkout@main
        with:
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}

      # nocobase-bot answers once per database and run attempt, and only a run it dispatched; the token can only read
      # nocobase3-pro and is revoked when this step ends, before any code of the forwarded commit runs.
      - name: Clone Pro ${{ needs.db-integration-plan.outputs.pro_branch }}
        env:
          BOT_URL: https://bot.v2.test.nocobase.com
          REQUEST_ID: ${{ inputs.request_id }}
          DATABASE: ${{ matrix.database }}
          PRO_BRANCH: ${{ needs.db-integration-plan.outputs.pro_branch }}
        run: |
          set -euo pipefail
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nocobase-bot" | jq -r .value)
          echo "::add-mask::$oidc"
          body=$(jq -n --arg request_id "$REQUEST_ID" --arg database "$DATABASE" '{request_id: $request_id, database: $database}')
          answer=$(curl -sS --retry 3 --retry-all-errors -w '\n%{http_code}' -X POST -H "Authorization: Bearer $oidc" -H 'content-type: application/json' --data "$body" "$BOT_URL/api/ci/pro-source-token")
          status=${answer##*$'\n'}
          answer=${answer%$'\n'*}
          if [ "$status" != 200 ]; then
            echo "::error::nocobase-bot gave no Pro source token (HTTP $status): $(jq -r '.error // empty' <<<"$answer" 2>/dev/null || true)"
            exit 1
          fi
          token=$(jq -r .token <<<"$answer")
          echo "::add-mask::$token"
          revoke() {
            curl -fsS -X DELETE -H "Authorization: Bearer $token" -H 'Accept: application/vnd.github+json' \
              https://api.github.com/installation/token >/dev/null || echo '::warning::The Pro source token could not be revoked; it expires within an hour.'
          }
          trap revoke EXIT
          auth=$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" clone --quiet --depth 1 \
            --branch "$PRO_BRANCH" --no-recurse-submodules https://github.com/nocobase/nocobase3-pro.git "$PRO_DIR"
          git -C "$PRO_DIR" log -1 --format='Pro %H %s' | tee -a "$GITHUB_STEP_SUMMARY"

      # Pro's lockfile and catalog follow the NocoBase 3 commit it pins; synchronized and resolved again here for the
      # forwarded one, in this run only, so a change to a dependency still reaches the tests.
      - name: Put the forwarded commit in place of Pro's NocoBase 3
        run: |
          set -euo pipefail
          rm -rf "$PRO_DIR/vendor/nocobase3"
          mkdir -p "$PRO_DIR/vendor/nocobase3"
          git archive HEAD | tar -x -C "$PRO_DIR/vendor/nocobase3"
          cd "$PRO_DIR"
          node scripts/sync-workspace-config.mjs --write

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ${{ env.PRO_DIR }}
        run: |
          CI=true pnpm install --no-frozen-lockfile
          git diff --stat -- pnpm-lock.yaml pnpm-workspace.yaml

      - name: Build shared development config
        working-directory: ${{ env.PRO_DIR }}
        run: pnpm dev-config:build

      - name: Test ${{ matrix.database }}
        working-directory: ${{ env.PRO_DIR }}
        run: pnpm --filter @nocobase/db-${{ matrix.database }} test:integration

  pro-db-integration-summary:
    name: Pro DB integration
    needs:
      - scope
      - db-integration-plan
      - pro-db-integration
    if: ${{ always() && needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify every Pro database
        env:
          PLAN_RESULT: ${{ needs['db-integration-plan'].result }}
          SHOULD_RUN: ${{ needs['db-integration-plan'].outputs.pro_should_run }}
          RESULT: ${{ needs['pro-db-integration'].result }}
        run: |
          if [ "$PLAN_RESULT" != success ]; then
            echo "Selecting the DB integration tests concluded with $PLAN_RESULT."
            exit 1
          fi
          if [[ "$SHOULD_RUN" == false && "$RESULT" == skipped ]]; then
            echo "No change to what every database shares; the Pro drivers are not tested."
          elif [[ "$SHOULD_RUN" != true || "$RESULT" != success ]]; then
            echo "One or more Pro database drivers concluded with $RESULT."
            exit 1
          fi

  quality:
    name: quality
    needs:
      - scope
      - quality-plan
      - changed-files
      - typecheck
      - test
      - build
      - create-app-smoke-default
      - create-app-smoke-examples
      - app-installer-smoke
      - db-integration-plan
      - db-integration
    if: ${{ always() && needs.scope.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify parallel jobs
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PLAN_RESULT: ${{ needs['quality-plan'].result }}
          RUN_CREATE_APP: ${{ needs['quality-plan'].outputs.run_create_app }}
          RUN_APP_INSTALLER: ${{ needs['quality-plan'].outputs.run_app_installer }}
          CHANGED_FILES_RESULT: ${{ needs.changed-files.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CREATE_APP_DEFAULT_RESULT: ${{ needs['create-app-smoke-default'].result }}
          CREATE_APP_EXAMPLES_RESULT: ${{ needs['create-app-smoke-examples'].result }}
          APP_INSTALLER_SMOKE_RESULT: ${{ needs['app-installer-smoke'].result }}
          DB_PLAN_RESULT: ${{ needs['db-integration-plan'].result }}
          DB_SHOULD_RUN: ${{ needs['db-integration-plan'].outputs.should_run }}
          DB_INTEGRATION_RESULT: ${{ needs['db-integration'].result }}
        run: |
          if [[ "$SCOPE_RESULT" != "success" || "$PLAN_RESULT" != "success" || "$CHANGED_FILES_RESULT" != "success" || "$TYPECHECK_RESULT" != "success" || "$TEST_RESULT" != "success" || "$BUILD_RESULT" != "success" || "$DB_PLAN_RESULT" != "success" ]]; then
            echo "One or more quality jobs failed or were cancelled."
            exit 1
          fi

          # Accept a skipped smoke test only when the successful plan explicitly left it out.
          check_planned() {
            local name=$1 planned=$2 result=$3
            if [[ "$planned" == "false" && "$result" == "skipped" ]]; then
              echo "$name is not needed for this change."
            elif [[ "$planned" != "true" || "$result" != "success" ]]; then
              echo "$name concluded with $result (planned: $planned)."
              return 1
            fi
          }
          check_planned 'Create-app smoke (default)' "$RUN_CREATE_APP" "$CREATE_APP_DEFAULT_RESULT"
          check_planned 'Create-app smoke (examples)' "$RUN_CREATE_APP" "$CREATE_APP_EXAMPLES_RESULT"
          check_planned 'App-installer smoke' "$RUN_APP_INSTALLER" "$APP_INSTALLER_SMOKE_RESULT"

          # Only accept a skipped matrix when the successful planner explicitly selected no databases.
          if [[ "$DB_SHOULD_RUN" == "false" && "$DB_INTEGRATION_RESULT" == "skipped" ]]; then
            echo "No database integration tests required."
          elif [[ "$DB_SHOULD_RUN" != "true" || "$DB_INTEGRATION_RESULT" != "success" ]]; then
            echo "Database integration tests failed, were cancelled, or were unexpectedly skipped."
            exit 1
          fi
