name: Validate Studio browser image
'on':
  push:
    branches:
    - fix/studio-e2e-browser-image
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
    - name: Prepare CI tools
      timeout-minutes: 2
      run: "curl --fail --silent --show-error --location --retry 3 --connect-timeout\
        \ 10 --max-time 30 \\\n  https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64\
        \ -o /tmp/jq\necho '020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d\
        \  /tmp/jq' | sha256sum --check\ninstall -m 755 /tmp/jq /usr/local/bin/jq\n"
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout: .github
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Create browser test project
      run: 'mkdir -p studio

        printf ''%s\n'' ''{"private":true,"packageManager":"pnpm@11.7.0","devDependencies":{"@playwright/test":"1.62.1","better-sqlite3":"13.0.3"}}''
        > studio/package.json'
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: studio/package.json
        run_install: false
    - name: Install test dependencies
      working-directory: studio
      run: pnpm install --config.allowBuilds.better-sqlite3=true
    - name: Verify Chromium
      timeout-minutes: 2
      working-directory: studio
      run: "pnpm exec node --input-type=module <<'NODE'\nimport { chromium } from\
        \ '@playwright/test';\nconst browser = await chromium.launch();\ntry {\n \
        \ const page = await browser.newPage();\n  await page.setContent('<title>Studio\
        \ browser check</title>');\n  if (await page.title() !== 'Studio browser check')\
        \ throw new Error('Chromium check failed');\n  console.log(`Chromium ${browser.version()}\
        \ is ready`);\n} finally {\n  await browser.close();\n}\nNODE\n"
    - name: Verify runner tools and workflow contracts
      run: 'node --version

        pnpm --version

        jq --version

        git --version

        zstd --version

        node --test .github/nocobase3/tests/studio-quality-contract.test.mjs .github/nocobase3/tests/framework-packages.test.mjs'
